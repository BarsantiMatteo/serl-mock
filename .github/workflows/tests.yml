# Runs the test suite (docs/06_testing.md) on every push and pull request.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Python version from .python-version; exact dependencies from uv.lock.
      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m pytest -q
